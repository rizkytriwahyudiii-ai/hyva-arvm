<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Analytics Admin | Hyva Arvm</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #f4f6f9; padding: 25px; color: #333; }
        .admin-wrapper { max-width: 1400px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #a68b5c; padding-bottom: 20px; margin-bottom: 30px; }
        .menu-tabs { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid #e1e4e8; padding-bottom: 10px; }
        .tab-btn { padding: 12px 24px; border: none; background: none; font-size: 14px; font-weight: 600; cursor: pointer; color: #7f8c8d; transition: 0.3s; position: relative; }
        .tab-btn.active { color: #a68b5c; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -12px; left: 0; width: 100%; height: 3px; background-color: #a68b5c; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .analytics-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 35px; }
        @media(max-width: 992px) { .analytics-grid { grid-template-columns: 1fr; } }
        .card-analytics { background: #fff; border: 1px solid #e2e8f0; padding: 24px; border-radius: 8px; }
        .revenue-box { text-align: center; display: flex; flex-direction: column; justify-content: center; background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%); color: white; border-radius: 8px; padding: 30px; }
        .revenue-box h2 { font-size: 32px; color: #a68b5c; margin-top: 5px; }
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; border: 1px solid #e2e8f0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background-color: #1a1a1a; color: white; padding: 14px; font-size: 13px; text-transform: uppercase; }
        td { padding: 14px; border-bottom: 1px solid #edf2f7; font-size: 13px; }
        .status-badge { padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 600; text-transform: uppercase; display: inline-block; }
        .status-packing { background: #fef3c7; color: #d97706; }
        .status-transit { background: #e0f2fe; color: #0369a1; }
        .status-delivered { background: #dcfce7; color: #15803d; }
        .select-status { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 12px; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-delete { background: #ef4444; color: white; }
        .form-grid-shipping { font-size: 12px; color: #475569; background: #f8fafc; padding: 10px; border-radius: 6px; border-left: 4px solid #a68b5c; margin-top: 5px; line-height: 1.5; }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div class="header-panel">
        <h2><i class="fas fa-chart-line" style="color: #a68b5c;"></i> Hyva Arvm Control Center</h2>
        <a href="index.html" style="text-decoration:none; color:#333; font-weight:600;"><i class="fas fa-store"></i> Toko Utama</a>
    </div>
    <div class="menu-tabs">
        <button class="tab-btn active" onclick="openAdminSection('orders-section', this)">Penjualan & Pelacakan Order</button>
        <button class="tab-btn" onclick="openAdminSection('users-section', this)">Database Konsumen</button>
    </div>
    <div id="orders-section" class="tab-content active">
        <div class="analytics-grid">
            <div class="card-analytics">
                <h4 style="margin-bottom:20px;"><i class="fas fa-fire" style="color: #e67e22;"></i> Produk Terlaris</h4>
                <div style="position: relative; height:270px; width:100;"><canvas id="productsChart"></canvas></div>
            </div>
            <div class="revenue-box">
                <h4>TOTAL OMSET</h4>
                <h2 id="total-revenue-label">Rp 0</h2>
                <h5 style="margin-top:15px;" id="total-orders-label">0 Pesanan</h5>
            </div>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>ID Order</th><th>Tanggal</th><th>User</th><th>Penerima & Alamat</th><th>Produk</th><th>Total</th><th>Status</th><th>Aksi</th><th>Opsi</th></tr>
                </thead>
                <tbody id="order-table-body"></tbody>
            </table>
        </div>
    </div>
    <div id="users-section" class="tab-content">
        <div class="table-responsive">
            <table>
                <thead><tr><th>UID</th><th>Nama Akun</th><th>Email</th><th>Tindakan</th></tr></thead>
                <tbody id="user-table-body"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="script.js"></script>
<script>
    function openAdminSection(sectionId, currentButton) {
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        currentButton.classList.add('active');
    }
</script>
</body>
</html>
