<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Gerbang Admin | Hyva Arvm</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #111; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #ffffff; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-top: 5px solid #a68b5c; text-align: center; }
        .login-card h2 { font-size: 18px; color: #111; margin-bottom: 8px; letter-spacing: 1px; font-weight: 600; }
        .login-card p { font-size: 11px; color: #777; margin-bottom: 25px; text-transform: uppercase; }
        
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i.prefix-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa; }
        .input-group input { width: 100%; padding: 12px 45px 12px 45px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #a68b5c; }
        
        /* Style Khusus Tombol Mata */
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #777; cursor: pointer; transition: 0.2s; z-index: 10; padding: 5px; }
        .toggle-password:hover { color: #a68b5c; }
        
        .btn-login { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #a68b5c; }
        .back-store { display: inline-block; margin-top: 20px; font-size: 12px; color: #a68b5c; text-decoration: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>CORE SYSTEM ADMIN</h2>
    <p>Hyva Arvm Security Gate</p>
    
    <form id="admin-gate-form" onsubmit="handleSecureLogin(event)">
        <div class="input-group">
            <i class="fas fa-user-shield prefix-icon"></i>
            <input type="text" id="admin-user" placeholder="Username Admin" required autocomplete="off">
        </div>
        
        <div class="input-group">
            <i class="fas fa-key prefix-icon"></i>
            <input type="password" id="admin-pass" placeholder="Password PIN" required>
            <span class="toggle-password" onclick="togglePasswordVisibility()">
                <i id="eye-icon" class="far fa-eye"></i>
            </span>
        </div>
        
        <button type="submit" class="btn-login">VERIFIKASI AKSES</button>
    </form>
    <a href="index.html" class="back-store"><i class="fas fa-arrow-left"></i> Kembali ke Toko</a>
</div>
<script>
    // 1. FUNGSI TOMBOL MATA (SHOW/HIDE PASSWORD)
    function togglePasswordVisibility() {
        const passInput = document.getElementById('admin-pass');
        const eyeIcon = document.getElementById('eye-icon');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('far', 'fa-eye');
            eyeIcon.classList.add('fas', 'fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('fas', 'fa-eye-slash');
            eyeIcon.classList.add('far', 'fa-eye');
        }
    }

    // 2. PROSES LOGIN SECURE (VERSI STABIL LOKAL & HOSTING)
    function handleSecureLogin(event) {
        event.preventDefault();
        
        // Mengambil input dan membersihkan spasi tidak sengaja
        const userInput = document.getElementById('admin-user').value.trim();
        const passInput = document.getElementById('admin-pass').value.trim();

        // Kunci rahasia tersamar (Aman dari inspect element orang awam)
        // YWRtaW5oeXZh = "adminhyva"
        // aHl2YTIwMjY= = "hyva2026"
        const KEY_U = "YWRtaW5oeXZh";
        const KEY_P = "aHl2YTIwMjY=";

        // Proses verifikasi menggunakan decoding btoa/atob bawaan yang super stabil
        if (btoa(userInput) === KEY_U && btoa(passInput) === KEY_P) {
            
            // Buat token akses resmi untuk diserahkan ke file admin.html
            const secureToken = "HYVA-AUTH-" + Math.random().toString(36).substring(2) + Date.now();
            sessionStorage.setItem('adminSessionToken', secureToken);
            
            alert("Akses diterima! Selamat datang kembali Master Admin Hyva Arvm.");
            window.location.href = "admin.html";
        } else {
            alert("Akses ditolak! Username atau Password PIN yang Kakak masukkan salah.");
        }
    }
</script>
</body>
</html>
